{% extends 'store/base.html' %}

{% block content %}
<div class="bg-white p-4 rounded shadow-sm">
    

    <h2 class="text-center fw-bold mb-4">Our Products</h2>

    <!-- Search Bar -->
    <form method="GET" class="mb-4 text-center">
        <input type="text" name="q" placeholder="Search products..." class="form-control w-50 mx-auto">
    </form>

    <div class="row g-4">
        {% for product in products %}
        <div class="col-md-4 mb-4">
            <a href="{% url 'product_detail' product.id %}" style="text-decoration:none; color:black;">
                <div class="card h-100 shadow-sm">

                    {% if product.image %}
                    <img src="{{ product.image.url }}" class="card-img-top"
                        style="height:220px; object-fit:cover; border-top-left-radius:12px; border-top-right-radius:12px;">
                    {% endif %}

                    <div class="card-body d-flex flex-column">
                        <h5 class="fw-bold">{{ product.name }}</h5>

                        <p class="text-muted small">
                            {{ product.description|truncatewords:12 }}
                        </p>

                        <div class="mt-auto">
                            <h5 class="text-success fw-bold">₹{{ product.price }}/Set</h5>

                            <a href="{% url 'product_detail' product.id %}" class="btn btn-dark w-100 mt-2">
                                View Product
                            </a>
                        </div>
                    </div>

                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
