{% extends 'store/base.html' %}
{% block content %}

<div class="container py-4" style="max-width:620px;">

    <a onclick="goBack(); return false;" href="#" class="back-btn">
        <i class="bi bi-arrow-left"></i> Back
    </a>

    <span class="section-label">✦ Checkout</span>
    <h2 style="font-family:'Nunito',sans-serif; font-weight:900; margin-bottom:24px;">Place Your Order</h2>

    <div class="checkout-card">
        <div style="background:#fff8f5; border-radius:14px; padding:18px 20px; margin-bottom:24px; border:1.5px solid #ffe5d9;">
            <h5 style="font-family:'Nunito',sans-serif; font-weight:800; margin-bottom:4px;">{{ product.name }}</h5>
            <div style="font-family:'Nunito',sans-serif; font-size:1.4rem; font-weight:900; color:#ff6b35;">
                ₹{{ product.price }}/Set
            </div>
        </div>

        <div style="background:#e8f4fd; border-radius:12px; padding:14px 18px; margin-bottom:24px; font-size:0.88rem; color:#0c5a8e;">
            <i class="bi bi-info-circle-fill me-2"></i>
            After placing the order, please confirm via WhatsApp.
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label style="font-weight:600; font-size:0.88rem; color:#555; margin-bottom:6px; display:block;">Your Name</label>
                <input type="text" name="name" class="form-control" placeholder="Enter your name" required>
            </div>

            <div class="mb-3">
                <label style="font-weight:600; font-size:0.88rem; color:#555; margin-bottom:6px; display:block;">Delivery Address</label>
                <textarea name="address" class="form-control" placeholder="Enter your full address" rows="3" required></textarea>
            </div>

            <div class="mb-4">
                <label style="font-weight:600; font-size:0.88rem; color:#555; margin-bottom:6px; display:block;">Quantity</label>
                <input type="number" name="quantity" id="quantity" class="form-control"
                       value="1" min="1" onchange="updatePrice()" style="max-width:140px;">
            </div>

            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; padding:18px 20px; background:#f8f8f8; border-radius:14px;">
                <span style="font-weight:600; color:#555;">Total Price</span>
                <span id="totalPrice" style="font-family:'Nunito',sans-serif; font-size:1.8rem; font-weight:900; color:#ff6b35;">
                    ₹{{ product.price }}
                </span>
            </div>

            <button type="submit" class="btn-theme w-100 text-center" style="border:none; cursor:pointer; display:block; border-radius:14px; padding:14px;">
                Place Order →
            </button>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    let price = parseFloat("{{ product.price }}");
    function updatePrice() {
        let qty = parseInt(document.getElementById('quantity').value) || 1;
        document.getElementById('totalPrice').innerText = '₹' + (price * qty);
    }
</script>
{% endblock %}
