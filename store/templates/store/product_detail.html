{% extends 'store/base.html' %}

{% block content %}

<div class="container py-5">
   <div class="mb-3">
        <button onclick="goBack()" class="btn back-btn">
            <i class="bi bi-arrow-left"></i> 
        </button>
    </div>
    <div class="row align-items-center g-5">

        <!-- IMAGE SECTION -->
        <div class="col-md-6">

            {% if product.images.all %}
            <!-- MULTIPLE IMAGES -->
            <div id="productCarousel" class="carousel slide" data-bs-ride="carousel">

                <div class="carousel-inner">

                    {% for img in product.images.all %}
                    <div class="carousel-item {% if forloop.first %}active{% endif %}">
                        <img src="{{ img.image.url }}" class="d-block w-100 product-img">
                    </div>
                    {% endfor %}

                </div>

                {% if product.images.all|length > 1 %}
                <!-- Controls -->
                <button class="custom-arrow left" type="button" data-bs-target="#productCarousel" data-bs-slide="prev">
                    &#10094;
                </button>
                
                <button class="custom-arrow right" type="button" data-bs-target="#productCarousel" data-bs-slide="next">
                    &#10095;
                </button>
                {% endif %}

            </div>

            {% else %}
            <!-- FALLBACK (OLD IMAGE FIELD) -->
            <img src="{{ product.image.url }}"
                 class="img-fluid rounded shadow product-img">
            {% endif %}

        </div>

        <!-- PRODUCT DETAILS -->
        <div class="col-md-6">
            <h2 class="fw-bold mb-3">{{ product.name }}</h2>

            <h3 class="text-success fw-bold mb-3">₹{{ product.price }}/Set</h3>

            <p class="text-muted mb-4">{{ product.description }}</p>

            <a href="{% url 'buy_now' product.id %}"
               class="btn btn-success btn-lg">
                Buy Now
            </a>
        </div>

    </div>
</div>

{% endblock %}
